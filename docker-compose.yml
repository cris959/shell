services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: salud_financiera
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d salud_financiera" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  # Comentado temporalmente hasta que esté la carpeta python-nlp-service
  python-nlp:
    build: ./python-nlp-service
    container_name: python_nlp_api
    ports:
      - "8000:8000"
    # env_file le dice a Docker Compose que cargue el .env local
    env_file:
      - .env
    environment:
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    networks:
      - app-network

  backend-spring:
    build: ./backend
    container_name: spring_backend
    ports:
      - "8008:8008"  # Tu máquina (8008) -> Contenedor (8008)
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/salud_financiera
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: secretpassword
      # OJO: Entre contenedores se usa el nombre del servicio de Docker y el puerto INTERNO (8000)
      PYTHON_NLP_SERVICE_URL: http://python-nlp:8000
    depends_on:
      postgres-db:
        condition: service_healthy
      python-nlp:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Dashboard - Hackathon Finanzas</title>
</head>
<body>
<section>
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-12">
                <h1 class="mb-4">Panel de Control / Dashboard</h1>
                <div class="alert alert-success" role="alert">
                    ¡Has iniciado sesión y entrado al sistema correctamente!
                </div>
            </div>
        </div>

        <!-- Sección de Acciones Rápidas -->
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Análisis Financiero</h5>
                        <p class="card-text">Ingresa tus datos financieros o transacciones para procesarlos con el modelo de IA.</p>
                        <a href="/analisis" class="btn btn-primary">Ir a Ingresar Datos</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mi Salud Financiera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
        }
        .brand-side {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .logo-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        @media (max-width: 768px) {
            .brand-side {
                padding: 1.5rem;
                text-align: center;
            }
            .logo-img {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid auth-container p-0">
    <div class="row g-0 h-100">

        <!-- Columna Izquierda: Logo y Branding -->
        <div class="col-lg-5 col-md-6 brand-side d-flex">
            <div class="text-center">
                <!-- Usamos th:src para asegurar que Thymeleaf resuelva bien la ruta estática -->
                <img th:src="@{/images/logo-gato.png}" alt="Logo" class="logo-img mb-3">
                <h3 class="fw-bold text-dark">Mi Salud Financiera</h3>
                <p class="text-muted">El Experto Alentador</p>
                <p class="small text-secondary mt-3 d-none d-md-block">Transforma tus transacciones en decisiones inteligentes.</p>
            </div>
        </div>

        <!-- Columna Derecha: Formulario de Login -->
        <div class="col-lg-7 col-md-6 d-flex align-items-center justify-content-center p-4 bg-white">
            <div class="w-100" style="max-width: 420px;">
                <div class="text-center mb-4">
                    <h2 class="fw-bold fs-3">¡Bienvenido de nuevo!</h2>
                    <p class="text-muted small">Ingresa a tu cuenta para continuar.</p>
                </div>

                <!-- Alerta de error -->
                <div th:if="${error}" class="alert alert-danger py-2 small" role="alert" th:text="${error}"></div>

                <!-- 🚀 Botón de Inicio de Sesión con Google OAuth2 -->
                <a href="/oauth2/authorization/google" class="btn btn-outline-dark w-100 py-2 mb-3 d-flex align-items-center justify-content-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    </svg>
                    Continuar con Google
                </a>

                <!-- Divisor visual -->
                <div class="position-relative text-center my-3">
                    <hr class="text-muted">
                    <span class="position-absolute top-50 start-50 translate-middle px-2 bg-white small text-muted">o ingresa con email</span>
                </div>

                <!-- Formulario Tradicional -->
                <form th:action="@{/login}" th:object="${loginRequest}" method="post">

                    <div class="mb-3">
                        <label for="correo" class="form-label small fw-semibold">Correo Electrónico</label>
                        <input type="email" class="form-control" id="correo" th:field="*{email}" placeholder="fulanito@example.com" autocomplete="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold">Contraseña</label>
                        <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="******" autocomplete="current-password" required>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="recuerdame">
                            <label class="form-check-label small text-muted" for="recuerdame">Recuérdame</label>
                        </div>
                        <a th:href="@{/recuperar-password}" class="small text-decoration-none">¿Olvidaste tu contraseña?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Iniciar Sesión</button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-muted">¿No tienes una cuenta? <a th:href="@{/registro}" class="text-decoration-none fw-semibold">Crea tu cuenta</a></p>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

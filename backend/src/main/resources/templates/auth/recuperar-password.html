<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Mi Salud Financiera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .auth-container { min-height: 100vh; }
        .brand-side {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .logo-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid auth-container p-0">
    <div class="row g-0 h-100">

        <!-- Columna Izquierda: Branding -->
        <div class="col-lg-5 col-md-6 brand-side d-flex">
            <div class="text-center">
                <img th:src="@{/images/logo-gato.png}" alt="Logo" class="logo-img mb-3">
                <h3 class="fw-bold text-dark">Mi Salud Financiera</h3>
                <p class="text-muted">Recupera el acceso a tu cuenta de forma segura.</p>
            </div>
        </div>

        <!-- Columna Derecha: Formulario -->
        <div class="col-lg-7 col-md-6 d-flex align-items-center justify-content-center p-4 bg-white">
            <div class="w-100" style="max-width: 420px;">
                <div class="text-center mb-4">
                    <h2 class="fw-bold fs-3">¿Olvidaste tu contraseña?</h2>
                    <p class="text-muted small">Ingresa tu correo electrónico y te enviaremos los pasos para restablecerla.</p>
                </div>

                <!-- Alertas -->
                <div th:if="${exito}" class="alert alert-success py-2 small" role="alert" th:text="${exito}"></div>

                <!-- Formulario -->
                <form th:action="@{/recuperar-password}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold">Correo Electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="fulanito@example.com" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Enviar instrucciones</button>
                </form>

                <div class="text-center mt-3">
                    <a th:href="@{/login}" class="small text-decoration-none fw-semibold">← Volver al inicio de sesión</a>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

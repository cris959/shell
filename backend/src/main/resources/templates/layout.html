<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, content)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Mi Aplicación Financiera</title>
    <!-- Bootstrap CSS para que luzca bien -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Barra de navegación común -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Hackathon Finanzas</a>
    </div>
</nav>

<!-- Contenido dinámico principal -->
<main class="container my-4">
    <div th:replace="${content}"></div>
</main>

<!-- Footer -->
<footer class="bg-light text-center py-3 mt-auto">
    <p class="text-muted mb-0">&copy; 2026 Hackathon Team 17</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</html>

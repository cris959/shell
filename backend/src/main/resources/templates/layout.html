<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org" th:fragment="layout (title, content)">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">FinanceAI</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        /* global tailwind */
        tailwind.config = {
            theme: {
                extend: {
                    zIndex: {
                        '100': '100',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-row m-0 font-sans">

<!-- Inputs ocultos globales para capturar de forma segura los datos del usuario desde el backend -->
<input type="hidden" id="nombreUsuarioGlobal" th:value="${usuarioGlobal != null ? usuarioGlobal.nombre : 'Usuario'}">
<input type="hidden" id="emailUsuarioGlobal" th:value="${usuarioGlobal != null ? usuarioGlobal.email : 'usuario@ejemplo.com'}">

<!-- 1. Sidebar Lateral de Navegación (Fragmento) -->
<div th:replace="~{fragments/sidebar :: app-sidebar}"></div>

<!-- Overlay para dispositivos móviles -->
<div id="sidebarOverlay" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden" onclick="toggleSidebar()"></div>

<!-- Contenido Principal -->
<main class="flex-1 p-8 overflow-y-auto flex flex-col justify-between">
    <div>
        <!-- 2. Header Moderno unificado con Tailwind -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 bg-white py-3 px-6 rounded-2xl shadow-sm border border-slate-200">

            <!-- Lado Izquierdo: Botón Hamburguesa (Móviles) y Búsqueda de IA -->
            <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-start">
                <div class="flex items-center gap-3">
                    <button type="button" onclick="toggleSidebar()" class="md:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-xl transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                        </svg>
                    </button>
                </div>

                <!-- Barra de Búsqueda Interactiva conectada a la IA -->
                <form id="searchForm" class="relative w-full sm:w-80 md:w-96 lg:w-[420px]">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-400">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                        </svg>
                    </span>
                    <input type="text"
                           id="queryInput"
                           name="query"
                           placeholder="Pregúntale a la IA (ej. ¿Cómo mejorar mi ahorro?)..."
                           aria-label="Buscar"
                           class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-full text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition"
                           required>
                </form>
            </div>

            <!-- Sección Derecha: Notificaciones y Perfil de Usuario -->
            <div class="flex items-center gap-4 self-end sm:self-auto">
                <button type="button" class="relative p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-50 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                    </svg>
                </button>

                <div class="flex items-center gap-2.5">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop&crop=faces" alt="Avatar" class="w-9 h-9 rounded-full object-cover border border-slate-200 shadow-sm">
                    <span class="text-sm font-semibold text-slate-700"
                          th:text="${usuarioGlobal != null ? usuarioGlobal.nombre : 'Usuario'}">
                        Nombre
                    </span>
                </div>
            </div>
        </header>

        <!-- Contenido dinámico inyectado desde cada vista -->
        <div th:replace="${content}"></div>
    </div>

    <!-- 3. Pie de página inferior (Fragmento) -->
    <div th:replace="~{fragments/footer :: app-footer}"></div>
</main>

<!-- MODAL DEL ASISTENTE IA -->
<div id="modalAsistente" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-[100] p-4">
    <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-lg w-full transform transition-all border border-slate-100">
        <div class="flex justify-between items-start mb-4">
            <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                <span class="text-xl">✨</span> Asistente Financiero IA
            </h3>
            <button onclick="cerrarModalAsistente()" class="text-slate-400 hover:text-slate-600 transition">
                <span class="sr-only">Cerrar</span>
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div id="textoRespuestaIA" class="text-slate-600 text-sm mb-6 whitespace-pre-line bg-slate-50 p-4 rounded-xl border border-slate-100 max-h-[60vh] overflow-y-auto leading-relaxed">
            <p class="text-slate-400 italic text-center py-4">Esperando respuesta del servidor...</p>
        </div>

        <div class="text-end">
            <button onclick="cerrarModalAsistente()" class="px-5 py-2.5 bg-slate-900 text-white font-medium rounded-xl hover:bg-slate-800 transition-colors text-sm shadow-sm">
                Cerrar
            </button>
        </div>
    </div>
</div>

<!-- SCRIPTS DE COMPORTAMIENTO -->
<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('appSidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if (sidebar) {
            sidebar.classList.toggle('-translate-x-full');
        }
        if (overlay) {
            overlay.classList.toggle('hidden');
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        const searchForm = document.getElementById('searchForm');
        if (searchForm) {
            searchForm.addEventListener('submit', async function(event) {
                event.preventDefault();
                const queryInput = document.getElementById('queryInput');
                if (queryInput) {
                    await consultarAsistente(queryInput.value);
                }
            });
        }
    });

    async function consultarAsistente(query) {
        if (!query || query.trim() === "") return;

        const queryInput = document.getElementById('queryInput');
        if (queryInput) {
            queryInput.disabled = true;
            queryInput.placeholder = 'Consultando con la IA...';
        }

        const emailInput = document.getElementById('emailUsuarioGlobal');
        const emailUsuario = emailInput ? emailInput.value : 'usuario@ejemplo.com';

        try {
// ** Uso en Local **            const response = await fetch('http://localhost:8000/api/v1/consultar-ia', {
            const response = await fetch('/api/asistente/consultar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    query: query,
                    email: emailUsuario
                })
            });

            if (!response.ok) {
                console.warn("Error en la respuesta del servidor:", response.status);
                alert("Hubo un error al procesar tu consulta.");
                document.getElementById("textoRespuestaIA").innerHTML = '<p class="text-rose-600">Error al conectar con la IA.</p>';
                return;
            }

            const data = await response.json();
            document.getElementById("textoRespuestaIA").innerText = data["respuesta"];
            document.getElementById("modalAsistente").classList.remove("hidden");

        } catch (error) {
            console.error("Error de red al consultar el asistente:", error);
            alert("No se pudo conectar con el servidor de FastAPI.");
            document.getElementById("textoRespuestaIA").innerHTML = '<p class="text-rose-600">Error de red. Revisa la consola.</p>';
        } finally {
            if (queryInput) {
                queryInput.disabled = false;
                queryInput.value = '';
                queryInput.placeholder = 'Pregúntale a la IA (ej. ¿Cómo mejorar mi ahorro?)...';
            }
        }
    }

    function cerrarModalAsistente() {
        const modal = document.getElementById('modalAsistente');
        if (modal) {
            modal.classList.add("hidden");
        }
    }

    document.addEventListener('click', function(event) {
        const modal = document.getElementById('modalAsistente');
        if (event.target === modal) {
            cerrarModalAsistente();
        }
    });

    document.addEventListener('keydown', function(event) {
        const modal = document.getElementById('modalAsistente');
        if (event.key === 'Escape' && modal && !modal.classList.contains('hidden')) {
            cerrarModalAsistente();
        }
    });
</script>
</body>
</html>

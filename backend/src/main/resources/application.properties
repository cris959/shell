spring.application.name=finanzas
server.port=8008
# ===================================================================
# CONFIGURACIÓN DE CONEXIÓN A POSTGRESQL
# ===================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Controlador oficial de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ===================================================================
# # mientras duren las pruebas
spring.jpa.hibernate.ddl-auto=create-drop
#update
#create-drop

# Permite que Spring cargue data.sql en bases de datos relacionales
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Desactiva la advertencia de Open-in-View (recomendado para APIs REST)
spring.jpa.open-in-view=false
# Muestra en la consola las sentencias SQL reales
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Comenta esta línea si la tienes definida (Hibernate detecta la BD automáticamente)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#============================================
# URL del Microservicio Data / Python NLP
python.nlp.service.url=http://python-nlp:8000
# http://nlp-service-container:8000
# http://localhost:8000
#============================================
# Configuración opcional para límite de tamaño de archivo CSV subido
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================================
# 📌 CONFIGURACIÓN DE SWAGGER / OPENAPI 3
# ==========================================

# Ruta para acceder a la interfaz gráfica de Swagger UI (Ej: http://localhost:8008/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html

# Ordenar alfabéticamente los endpoints (HTTP methods / Paths)
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Deshabilitar / Habilitar la prueba de endpoints ("Try it out") en Swagger UI (true por defecto)
springdoc.swagger-ui.tryItOutEnabled=true

# Ruta personalizada para exponer la especificación en JSON de OpenAPI (Ej: http://localhost:8008/v3/api-docs)
springdoc.api-docs.path=/v3/api-docs

# Habilitar o deshabilitar la documentación OpenAPI por completo (util en entornos de Producción)
springdoc.api-docs.enabled=true

# Mostrar la sección de esquemas DTO al final de la página por defecto
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1

# ==========================================
# PROPIEDADES DE SEGURIDAD (JWT)
# ==========================================
# Clave secreta para firmar los tokens (mínimo 256 bits / 32 caracteres)
app.jwt-secret=${JWT_SECRET:claveSecretaSuperSeguraParaFirmarElTokenJWT1234567890FinanzasMVP}

# Expiración del token en milisegundos (24 horas = 86400000 ms)
app.jwt-expiration-milliseconds=${JWT_EXPIRATION_MS:86400000}